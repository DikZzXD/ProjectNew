name = "makluxnxx-api"
main = "src/index.js"
compatibility_date = "2025-08-01"
compatibility_flags = ["nodejs_compat"]
account_id = "6026080a507e6be878c0b0af5bde2e3e"

# ── Custom domain ─────────────────────────────────────────────
routes = [
  { pattern = "api.makluxnxx.my.id", custom_domain = true }
]

# ── Static docs UI (public/) ──────────────────────────────────
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/v1/*"]

# ── Workers AI (powers the /v1/ai/* endpoints) ────────────────
[ai]
binding = "AI"

# ── Triggers: cron auto-sync for userbot & background tasks ───
[triggers]
crons = ["* * * * *"]

# ── D1: request counters, bandwidth, recent activity ──────────
[[d1_databases]]
binding = "DB"
database_name = "makluxnxx-api-stats"
database_id = "9da212b2-9d14-4ef8-89fa-2a0684dca53a"

[vars]
# Display brand only. The Worker script name, D1 database name and the custom
# domain stay as-is: renaming those would create a new Worker and detach the
# live route + database.
SITE_NAME = "DikZzCodeAPIs"
OWNER_WA = "6285757411154"
OWNER_TG = "maklohytam"

# Telegram management bot (owner-only). The webhook lives at POST /api/telegram.
# OWNER_ID gates every command; only this Telegram user may manage the key pool.
TELEGRAM_BOT_TOKEN = "8809020193:AAEjzpLEdKGhl57QHp1TzTVjT2i-qS-ubxs"
OWNER_ID = "6446678808"

# Fallback rewind AI key, used when the D1 rewind_keys pool is empty. Prefer
# adding keys via the bot (/addrewind) so they can be rotated without a redeploy.
REWIND_KEY = "sk-rewind-184ccb3f30b91b7a33b240362e631894"

